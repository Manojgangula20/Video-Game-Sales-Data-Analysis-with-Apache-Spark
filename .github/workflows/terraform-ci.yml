
name: Terraform Infrastructure CI

on:
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/aws-data-platform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/terraform/aws-data-platform/**'
      - '.github/workflows/terraform-ci.yml'

jobs:
  terraform-validation:
    name: Format and Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform/aws-data-platform

      - name: Initialize Terraform
        run: terraform -chdir=infra/terraform/aws-data-platform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform/aws-data-platform validate
